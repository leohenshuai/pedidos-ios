# 手动触发：GitHub → pedidos-ios → Actions → Build unsigned IPA → Run workflow
# 与原版相比只改了第 1 项：去掉 push 触发和 Guard，改成纯手动触发。
# 其余步骤（Prepare / Build / Package / 上传 / 发 Release / 写 STATUS.txt）原样保留。
# status 分支只存 STATUS.txt（构建日志摘要 + IPA 字节数/md5），不再存 IPA 分片。
name: Build unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cache/pip
          key: ${{ runner.os }}-deps-v1
      - name: Smoke check (web assets)
        run: python3 tools/smoke_web.py
      - name: Prepare
        id: prep
        continue-on-error: true
        run: |
          set +e
          {
            echo "### xcodebuild -version"; xcodebuild -version
            echo "### brew install xcodegen"; brew install xcodegen 2>&1 | tail -15
            echo "### which xcodegen"; which xcodegen
            echo "### pillow"; python3 -m pip install --quiet --break-system-packages pillow 2>&1 | tail -5
            echo "### make_icon"; python3 make_icon.py 2>&1 | tail -5
            echo "### xcodegen"; xcodegen generate 2>&1 | tail -20
            echo "### ls"; ls
            echo "### xcodebuild -list"; xcodebuild -list -project Pedidos.xcodeproj 2>&1 | tail -25
            echo "### pbxproj head"; head -c 600 Pedidos.xcodeproj/project.pbxproj
          } > build.log 2>&1
          test -d Pedidos.xcodeproj
      - name: Build (no code signing)
        id: build
        if: steps.prep.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          xcodebuild -project Pedidos.xcodeproj -scheme Pedidos -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > xcb.log 2>&1
          echo "xcodebuild exit: $?" >> xcb.log
          grep -E "error:|BUILD (SUCCEEDED|FAILED)|exit:" xcb.log | tail -40 >> build.log
          grep -q "BUILD SUCCEEDED" xcb.log
      - name: Package IPA
        id: pack
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find build/Build/Products -name "Pedidos.app" -maxdepth 3 | head -1)
          echo "APP=$APP" >> build.log
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Payload/Pedidos.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/Pedidos.app/Info.plist >> build.log
          zip -qry Pedidos.ipa Payload
          ls -la Pedidos.ipa >> build.log
      - uses: actions/upload-artifact@v5
        if: steps.pack.outcome == 'success'
        with:
          name: Pedidos-ipa
          path: Pedidos.ipa
      - name: Publish to Release
        if: steps.pack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VER}.${{ github.run_number }}"
          gh release create "$TAG" Pedidos.ipa --title "Pedidos ${VER} (build ${{ github.run_number }})" --notes "Unsigned IPA. Re-sign with TrollStore / AltStore / Sideloadly before installing." --repo "${{ github.repository }}"
      - name: Save log
        if: always()
        run: |
          mkdir -p /tmp/st && cd /tmp/st && rm -rf .git
          { echo "prep=${{ steps.prep.outcome }} build=${{ steps.build.outcome }} pack=${{ steps.pack.outcome }}"; echo "----- build.log -----"; tail -150 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "no build.log"; } > STATUS.txt
          if [ -f "$GITHUB_WORKSPACE/Pedidos.ipa" ]; then
            echo "ipa bytes: $(wc -c < "$GITHUB_WORKSPACE/Pedidos.ipa" | tr -d ' ') md5: $(md5 -q "$GITHUB_WORKSPACE/Pedidos.ipa")" >> STATUS.txt
          fi
          git init -q && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b status && git add STATUS.txt; git commit -q -m "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status:status
