name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        run: |
          python3 -m pip install --quiet pillow
          python3 make_icon.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          xcodebuild -project Pedidos.xcodeproj -scheme Pedidos -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || echo "BUILD_FAILED" >> build.log
          tail -60 build.log
          grep -q BUILD_FAILED build.log && exit 1 || true
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "Pedidos.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Pedidos.ipa Payload
          ls -la Pedidos.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Pedidos-ipa
          path: Pedidos.ipa
      - name: Publish to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Pedidos.ipa --title "Pedidos IPA $TAG" --notes "Unsigned IPA. Re-sign with TrollStore / AltStore / Sideloadly before installing." --repo "${{ github.repository }}"
      - name: Save log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name ci && git config user.email ci@example.com
          git fetch origin status || true
          git checkout --orphan status-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp ../build.log . 2>/dev/null || cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no log" > build.log
          echo "job status: ${{ job.status }}" > STATUS.txt
          git add build.log STATUS.txt
          git commit -m "build ${{ github.run_number }}: ${{ job.status }}" || true
          git push -f origin status-tmp:status
