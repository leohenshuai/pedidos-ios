<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>订货单管理器</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;background:#fbf4ea;color:#3a2e2a;max-width:760px;margin:0 auto;min-height:100vh}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,.oc,.hr,.co{font-family:inherit;cursor:pointer;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35}
.top{position:sticky;top:0;z-index:5;background:#3a2e2a;color:#fbf4ea;padding:calc(8px + var(--sat)) 12px 8px}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:15px;letter-spacing:.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top b{color:#f0c987;font-size:15px;white-space:nowrap}
.back{border:0;background:#ffffff26;color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;flex:none;min-height:38px}
.sq,#q{width:100%;margin-top:6px;padding:8px 12px;border:0;border-radius:11px;font-size:16px;background:#fff;color:#3a2e2a;font-family:inherit}
.qc{display:flex;gap:5px;overflow-x:auto;padding-top:6px;-webkit-overflow-scrolling:touch}
.qc:empty{display:none}
.qc button{flex:none;border:0;border-radius:14px;padding:6px 10px;font-size:12.5px;background:#ffffff26;color:#fff;white-space:nowrap}
.qc button.on{background:var(--c,#f0c987);color:#fff;font-weight:700;box-shadow:0 0 0 2px #fff6}
.qc button.all.on{background:#f0c987;color:#3a2e2a}
/* ---- 主页 #vHome ---- */
.vwrap{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#hCnt{background:#ffffff1f;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
#hf{overflow-x:visible;gap:4px}
#hf button{flex:1 1 0;min-width:0;min-height:34px;padding:6px 2px;text-align:center;font-size:13px}
#hf .nb{display:inline-block;min-width:14px;margin-left:3px;padding:1px 5px;border-radius:8px;background:#ffffff33;font-size:11px;font-weight:400;line-height:1.3;text-align:center}
#vHome .st{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:9px;line-height:1.3;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px}
.oc{background-color:#fff;background-image:linear-gradient(90deg,var(--c) 0%,var(--c) 45%,rgba(255,255,255,0) 115%);background-repeat:no-repeat;background-position:top;background-size:100% 4px;border-radius:16px;padding:14px 12px 12px;box-shadow:0 1px 2px #3a2e2a0a,0 6px 16px #3a2e2a12;display:flex;flex-direction:column;gap:6px;min-height:150px;cursor:pointer;transition:transform .15s}
.oc:active{transform:scale(.98)}
.oct{font-size:15px;font-weight:700;line-height:1.2;word-break:break-word}
.ocm{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:11px;color:#888;min-height:28px;padding:3px 0}
.ocs{font-size:12px;color:#555;margin-top:auto}.ocs b{font-size:22px;font-weight:800;color:var(--c);line-height:1.05;margin-right:3px}
.oca{display:flex;gap:6px;margin-top:8px}
.oca button{flex:1;border:0;border-radius:9px;background:#f4f0e9;padding:0 4px;min-height:32px;font-size:12px;color:#3a2e2a;transition:background .15s}
.oca button.arm{background:#d9534f!important;color:#fff!important}
.oca button.del{color:#c0392b;font-weight:600}
.newo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:2px dashed #d8cbb4;border-radius:14px;background:#fffdf7;color:#a08e7c;min-height:120px}
.newo .np{font-size:28px;line-height:1;font-weight:300;color:#c7b49c}
.newo .nl{font-size:13px}
.empty{margin:0;padding:36px 16px;text-align:center;color:#aaa;line-height:1.7;grid-column:1/3}
.hl{margin:12px}.hs{font-size:13px;color:#888;margin:4px 4px 8px}
.hr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:6px solid var(--c);box-shadow:0 1px 6px #0001;cursor:pointer}
.hr div{flex:1;min-width:0}.hr b{font-size:16px}.hr small{display:block;font-size:12px;color:#999;margin-top:2px}
.pill{background:var(--c);color:#fff;border-radius:16px;padding:2px 12px;font-weight:700;font-size:16px}
.foot{margin:auto 14px 0;margin-top:auto;padding-top:10px;padding-bottom:calc(16px + var(--sab));font-size:12px;color:#999;line-height:1.7}
.foot .bk{display:flex;gap:8px;margin-bottom:10px}
.foot button,.foot label{flex:1;display:flex;align-items:center;justify-content:center;min-height:36px;text-align:center;border:1px solid #e7ddca;background:#fff;border-radius:9px;padding:6px 4px;font-size:12px;color:#4a3d35}

#vEdit{padding-bottom:calc(110px + var(--sab))}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 12px 0}
.meta label{font-size:11px;color:#999;display:block;margin:0 0 2px 4px}
.meta input{width:100%;padding:10px 10px;border:1px solid #e3d8c8;border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 12px 0}
.seg{grid-column:1/3;display:flex;background:#fff;border:1px solid #e3d8c8;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:#7a6a60}
.seg button.on{background:var(--c);color:#fff;font-weight:700}
.meta2 select{width:100%;padding:10px 8px;border:1px solid #e3d8c8;border-radius:10px;font-size:16px;background:#fff;color:#3a2e2a}
.ptog{display:flex;gap:6px}
.ptog button{flex:1;border:1px solid #e3d8c8;background:#fff;border-radius:10px;font-size:14px;padding:10px 8px;color:#7a6a60}
.ptog button.on{background:#3a2e2a;color:#fff;border-color:#3a2e2a}
.ptog input{width:46px;border:1px solid #e3d8c8;border-radius:10px;text-align:center;font-size:16px;font-family:inherit}
.st{display:inline-block;border-radius:10px;padding:3px 9px;font-size:12px;color:#fff}
section{margin:12px;background:#fff;border-radius:16px;overflow:hidden;border-top:8px solid var(--c);box-shadow:0 2px 10px #0001}
.sh{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.sh input.cn{font-size:19px;font-weight:700;color:var(--c);border:0;background:none;flex:1;letter-spacing:1px;min-width:0;font-family:inherit;padding:8px 0}
.sh .cnt{font-size:12px;color:#888;white-space:nowrap}
.dot{width:24px;height:24px;border-radius:50%;border:0;background:var(--c);flex:none}
.x{border:0;background:#f1eee9;border-radius:9px;color:#a33;font-size:14px;padding:10px 12px;flex:none;min-height:38px}
.x.arm{background:#d9534f;color:#fff}
input.cs{display:block;width:100%;font-size:16px;color:#999;border:0;background:none;padding:6px 10px 2px;font-family:inherit}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}
.ic{position:relative;background:#faf7f1;border:1px solid #eee;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ic .dl{position:absolute;top:0;right:0;width:34px;height:34px;border:0;background:none;color:#c9a9a6;font-size:17px;padding:0;z-index:1}
.ic textarea.nm{padding-right:26px}
.ic.zero{opacity:.45}
.ic.dup{border-color:#e9a23b;background:#fff8e8}
.dupb{font-size:11px;color:#c07d10;margin-top:-2px}
textarea.nm{width:100%;height:40px;resize:none;border:0;border-bottom:1px dashed #d8cfc0;background:none;font-size:16px;line-height:1.25;padding:0 0 2px;color:#3a2e2a;font-family:inherit;overflow:hidden;border-radius:0}
textarea.nm:focus{outline:none;border-bottom:2px solid var(--c);background:#fffbe9}
.ctr{display:flex;align-items:center;gap:4px}
.ctr button{width:40px;height:40px;border:0;border-radius:10px;background:var(--c);color:#fff;font-size:21px;flex:none;padding:0}
.ctr button.m{background:#e9e5de;color:#3a2e2a}
.ctr button.d{background:#f1eee9;color:#a33;font-size:16px;width:36px}
.ctr input{flex:1;min-width:0;width:100%;height:40px;text-align:center;font-size:18px;-moz-appearance:textfield;font-weight:700;border:1px solid #e5e0d7;border-radius:8px;background:#fff;font-family:inherit}
.pr{display:flex;align-items:center;gap:4px;font-size:13px;color:#888}
.pr input{flex:1;min-width:0;height:32px;border:1px solid #e5e0d7;border-radius:8px;text-align:right;padding:0 6px;font-size:16px;background:#fff;font-family:inherit}
.pr em{font-style:normal;color:#3a2e2a;font-weight:600;min-width:44px;text-align:right;font-size:13px}
.hint{grid-column:1/3;text-align:center;color:#aaa;font-size:14px;padding:14px 8px;line-height:1.6}.hint small{font-size:12px;color:#bbb}
.add{display:flex;gap:6px;padding:10px;background:#faf6ef;border-top:1px solid #eee}
.add input{min-width:0;padding:10px 10px;border:1px solid #e3d8c8;border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
.add input.an{flex:1}.add input.aq{width:54px;text-align:center}
.add button{border:0;border-radius:10px;background:var(--c);color:#fff;padding:0 16px;font-size:15px;min-height:44px}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px;background:#faf6ef}
.sug:empty{display:none}
.sug button{border:1px solid #e3d8c8;border-radius:14px;background:#fff;padding:5px 10px;font-size:13px;color:#3a2e2a}
.card{margin:12px;background:#fff;border-radius:14px;padding:12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:0;border-radius:16px;padding:7px 12px;color:#fff;font-size:14px}
.row2{display:flex;gap:6px;margin:12px}
.row2 input{flex:1;min-width:0;padding:12px 10px;border:1px dashed #b9a88f;border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
.row2 button{border:0;border-radius:12px;background:#3a2e2a;color:#fff;padding:0 16px;font-size:15px;min-height:44px}
.row2 button.g{background:#fff;color:#3a2e2a;border:1px solid #ddd;flex:1;padding:12px}
.row2 button.arm{background:#d9534f;color:#fff;border-color:#d9534f}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;display:flex;gap:6px;padding:10px 12px calc(18px + var(--sab));background:#fbf4eaee;backdrop-filter:blur(6px);z-index:6}
.bar button{flex:1;padding:13px 2px;border:0;border-radius:12px;font-size:14px;background:#3a2e2a;color:#fff;white-space:nowrap}
.bar button.g{background:#fff;color:#3a2e2a;border:1px solid #ddd}
.bar button.sm{flex:none;width:40px;padding:13px 0;font-size:17px}
#pv{position:fixed;inset:0;z-index:20;background:#000d;display:none;overflow:auto;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab))}
#pv .in{max-width:760px;margin:0 auto}
#pv img{width:100%;border-radius:10px;display:block}
.pbw{position:sticky;top:0;z-index:2;background:#000c;margin:calc(-12px - var(--sat)) -12px 8px;padding:calc(12px + var(--sat)) 12px 12px}
.pb{display:flex;gap:8px;margin-bottom:8px}
.pb button,.pb a{flex:1;text-align:center;padding:11px 4px;border:0;border-radius:12px;font-size:15px;background:#fff;color:#3a2e2a;text-decoration:none}
.po{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px}
.po .th{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}
.po .th.on{border-color:#fff;box-shadow:0 0 0 2px #0008}
.po .lg{margin-left:auto;display:flex;border-radius:10px;overflow:hidden}
.po .lg button{border:0;background:#ffffff33;color:#fff;padding:7px 14px;font-size:13px}
.po .lg button.on{background:#fff;color:#3a2e2a;font-weight:700}
#pv p{color:#fff9;font-size:12px;text-align:center;margin:8px 0 30px}
#md{position:fixed;inset:0;z-index:40;background:#0007;display:none;align-items:flex-end;justify-content:center}
#md.c{align-items:center;padding:20px}
#mb{background:#fff;width:100%;max-width:760px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--sab))}
#md.c #mb{border-radius:18px;max-width:420px}
.mh{font-size:18px;font-weight:700;margin-bottom:6px}
.mt{font-size:13px;color:#888;line-height:1.5;margin-bottom:8px}
#mb textarea{width:100%;min-height:200px;border:1px solid #e3d8c8;border-radius:12px;padding:10px;font-size:16px;font-family:inherit;line-height:1.4;background:#fffdf8;color:#3a2e2a}
.mb2{display:flex;gap:8px;margin-top:10px}
.mb2 button,.ab button{flex:1;border:0;border-radius:12px;padding:12px 6px;font-size:15px;background:#3a2e2a;color:#fff}
.mb2 button.g,.ab button.g{background:#f1eee9;color:#3a2e2a}
.am{font-size:16px;line-height:1.5;margin-bottom:12px}
.ab{display:flex;flex-direction:column;gap:8px}
.ig{border:1px solid #eee;border-radius:12px;margin:8px 0;overflow:hidden}
.igh{display:flex;gap:6px;align-items:center;background:#faf6ef;padding:8px;font-size:14px}
.igh span{font-weight:700;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.igh select,.igh input{min-width:0;flex:1;padding:8px 6px;border:1px solid #e3d8c8;border-radius:8px;font-size:16px;background:#fff;font-family:inherit}
.ir{display:flex;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid #f1eee9}
.ir.dup{background:#fff8e8}
.ir input.irn{flex:1;min-width:0;border:0;border-bottom:1px dashed #d8cfc0;padding:8px 2px;font-size:16px;background:none;font-family:inherit}
.ir input.irq{width:56px;text-align:center;border:1px solid #e5e0d7;border-radius:8px;padding:8px 0;font-size:16px;font-family:inherit}
.ir button{border:0;background:#f1eee9;color:#a33;border-radius:8px;width:30px;height:30px}
.tag{font-size:11px;color:#c07d10;white-space:nowrap}
.opt{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0;flex-wrap:wrap}
.opt select{padding:9px;border:1px solid #e3d8c8;border-radius:8px;font-size:16px;background:#fff}
.vr{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #f1eee9;font-size:15px}
.vr small{color:#999;margin-left:8px}
.vr button{border:0;background:#f1eee9;color:#a33;border-radius:8px;padding:5px 10px}
.cg{border:1px solid #eee;border-radius:12px;margin:8px 0;overflow:hidden}
.cgh{display:flex;align-items:center;gap:8px;background:#faf6ef;padding:9px 10px;font-size:14px;position:sticky;top:0}
.cgh b{flex:1}.cgh button{border:0;background:#fff;border:1px solid #e3d8c8;border-radius:8px;padding:5px 9px;font-size:12px;color:#3a2e2a}
.co{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid #f1eee9;font-size:15px}
.co input{width:24px;height:24px;flex:none}.co span{flex:1;min-width:0}.co small{color:#999;font-size:12px}
.co.have{opacity:.5}.co .tg{font-size:11px;color:#3aa655;white-space:nowrap}
.cl{max-height:44vh;max-height:44dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.xp{max-height:48vh;max-height:48dvh;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid #e3d8c8;border-radius:10px;margin-top:6px}
.xp table{border-collapse:collapse;width:100%;font-size:14px}
.xp th{position:sticky;top:0;background:#3a2e2a;color:#fff;padding:8px 6px;font-weight:600;z-index:1}
.xp td{border:1px solid #d9d2c5;padding:6px 8px}
.xp td.q,.xp th.q,.xp td.n,.xp th.n{text-align:center}.xp td.r{text-align:right}
.xp tr.tot td{background:#f0c987;font-weight:700;position:sticky;bottom:0}
.xp td.c{font-weight:700;text-align:center;vertical-align:middle;word-break:break-word}
.xm{font-size:12px;color:#888;margin-top:6px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:#3a2e2af0;color:#fff;border-radius:22px;padding:10px 16px;font-size:14px;z-index:50;display:none;max-width:92vw;text-align:center}
#toast u{color:#f0c987;margin-left:12px;cursor:pointer}
</style></head><body>

<div id="vHome"><div class="vwrap">
 <div class="top"><div class="r1"><h1>📦 订货单管理器</h1><b id="hCnt"></b></div>
  <input id="hq" class="sq" type="search" placeholder="搜索所有订单里的品项，如 Lola" oninput="HQ=this.value;renderHome()">
  <div id="hf" class="qc"></div></div>
 <div id="olist"></div>
 <div class="foot">
  <div class="bk"><button onclick="exportAll()">导出全部备份</button><label>导入备份<input type="file" accept=".json,application/json" style="display:none" onchange="importAll(this)"></label><button onclick="vocabModal()">品名库</button></div>
 </div>
</div></div>

<div id="vEdit" style="display:none">
 <div class="top">
  <div class="r1"><button class="back" onclick="goHome()">‹ 列表</button><h1 id="eTitle"></h1><b id="eTotal"></b></div>
  <input id="q" type="search" placeholder="🔍 搜索品名来订货（忽略重音/大小写）" oninput="onSearch(this.value)">
  <div id="qc" class="qc"></div>
 </div>
 <div class="meta">
  <div><label>供应商 / 标题</label><input id="eSup" oninput="setf('sup',this.value)" placeholder="例如 SAPHIRUS"></div>
  <div><label>日期</label><input id="eDt" oninput="setf('dt',this.value)" placeholder="dd/mm/aaaa"></div>
 </div>
 <div class="meta2">
  <div class="seg" id="eSt"></div>
  <select id="eSort" onchange="setf('sort',this.value);renderEdit()"><option value="manual">排序：手动</option><option value="az">排序：A → Z</option><option value="qty">排序：数量多→少</option></select>
  <div class="ptog"><button id="ePr" onclick="togglePrice()">💲 单价</button><input id="eCur" maxlength="4" oninput="setf('cur',this.value||'$');renderEdit()" title="货币符号"></div>
 </div>
 <div id="list"></div>
 <div class="row2"><input id="ncn" placeholder="+ 新增种类（如 JABÓN LÍQUIDO）" autocapitalize="characters" oninput="liveCase(this,'upper')" onkeydown="if(event.key=='Enter')addCat()"><button onclick="addCat()">添加种类</button></div>
 <div class="row2"><button class="g" onclick="arm(this,clearQty,'确认清零?')">全部数量清零</button></div>
 <div class="bar">
  <button class="g sm" onclick="goHome()" title="订单列表">‹</button>
  <button class="g sm" id="bUndo" onclick="undo()" title="撤销">↶</button>
  <button class="g sm" id="bRedo" onclick="redo()" title="重做">↷</button>
  <button class="g" onclick="moreMenu()">更多 ⋯</button>
  <button class="g" onclick="sendSheet()">发送表格</button>
  <button onclick="poster()">生成海报</button>
 </div>
</div>

<div id="md" onclick="if(event.target==this)mdBack()"><div id="mb"></div></div>
<div id="toast"></div>
<div id="pv"><div class="in">
 <div class="pbw">
  <div class="pb"><button onclick="$('pv').style.display='none'">← 返回</button><a id="dl" download="pedido.png">保存图片</a><button onclick="exportPdf()">导出 PDF</button></div>
  <div class="po"><span>主题</span><span id="thm" style="display:flex;gap:8px"></span><div class="lg"><button id="lgEs" onclick="setLang('es')">Español</button><button id="lgZh" onclick="setLang('zh')">中文</button></div></div>
 </div>
 <img id="pimg"><p>也可以长按图片 → 存储到照片 / 分享</p>
</div></div>

function tcName(s){s=String(s).replace(/\s+/g," ").trim();if(!s)return s;

function vocabFind(n){const k=norm(n);return S.vocab.find(v=>norm(v)==k)||null}

function addVocab(n){const k=norm(n);if(!k)return;if(!vocabFind(n))S.vocab.push(n)}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
function fuzzy(n,lim){const k=norm(n);if(k.length<4)return[];const r=[];S.vocab.forEach(v=>{const kv=norm(v);if(kv==k)return;const d=lev(k,kv);if(d<=(k.length<=5?1:2))r.push([d,v])});r.sort((a,b)=>a[0]-b[0]);return r.slice(0,lim||3).map(x=>x[1])}

/* ---------- 存取 ---------- */
function fix(s){
 if(!s||!Array.isArray(s.orders))return null;
 s.vocab=Array.isArray(s.vocab)?s.vocab.filter(v=>typeof v=="string"&&v.trim()):null;
 s.del=(s.del&&typeof s.del=="object")?s.del:{};
 s.orders.forEach(o=>{o.id=o.id||uid();o.upd=o.upd||0;o.sup=o.sup||"";o.dt=o.dt||"";
  o.status=STAT[o.status]?o.status:"draft";o.sort=["manual","az","qty"].includes(o.sort)?o.sort:"manual";
  o.price=!!o.price;o.cur=o.cur||"$";o.lang=o.lang=="zh"?"zh":"es";o.theme=(o.theme>=0&&o.theme<THEMES.length)?(o.theme|0):0;
  o.cats=(o.cats||[]).map((c,i)=>({name:c.name||"",sub:c.sub||"",color:c.color||COLORS[i%8],items:(c.items||[]).map(it=>Array.isArray(it)?{n:String(it[0]),q:parseInt(it[1])||0,p:null}:{n:String(it.n||""),q:Math.max(0,parseInt(it.q)||0),p:(it.p==null||it.p==="")?null:Math.max(0,parseFloat(it.p)||0)})}))});
 if(!s.vocab){const m=new Map();s.orders.forEach(o=>o.cats.forEach(c=>c.items.forEach(i=>{const k=norm(i.n);if(k&&!m.has(k))m.set(k,i.n)})));s.vocab=[...m.values()]}
 return s}

 S.orders=[...map.values()].filter(o=>!(S.del[o.id]&&S.del[o.id]>=(o.upd||0)));
 const have=new Set(S.vocab.map(norm));(j.vocab||[]).forEach(v=>{if(!have.has(norm(v))){S.vocab.push(v);have.add(norm(v))}});
}

/* ---------- 撤销 / 重做（每个订单独立） ---------- */
const HS={};
const snap=o=>{const c=JSON.parse(JSON.stringify(o));delete c.upd;return JSON.stringify(c)};
const hist=o=>HS[o.id]||(HS[o.id]={u:[],r:[],tag:"",t:0});
function mut(fn,tag,noRender){
 const o=cur();if(!o)return;const h=hist(o),before=snap(o);fn(o);
 if(snap(o)==before)return;
 const now=Date.now();
 if(!(tag&&h.tag===tag&&now-h.t<1500)){h.u.push(before);if(h.u.length>100)h.u.shift()}
 h.tag=tag||"";h.t=now;h.r=[];o.upd=now;save();
 if(!noRender)renderEdit();else syncUndo();
}
function restore(o,s){const c=JSON.parse(s);Object.keys(o).forEach(k=>{if(k!="id")delete o[k]});Object.assign(o,c);o.upd=Date.now();save();renderEdit()}
function undo(){const o=cur();if(!o)return;const h=hist(o);if(!h.u.length)return;h.r.push(snap(o));h.tag="";restore(o,h.u.pop())}
function redo(){const o=cur();if(!o)return;const h=hist(o);if(!h.r.length)return;h.u.push(snap(o));h.tag="";restore(o,h.r.pop())}

function parseText(txt,defCat){
 const lines=String(txt).replace(/\r/g,"").split("\n"),cats=[];let cc=null;
 const getCat=n=>{let c=cats.find(x=>norm(x.name)==norm(n));if(!c){c={name:n,items:[]};cats.push(c)}return c};
 for(let li=0;li<lines.length;li++){const raw=lines[li];
  let s=raw.replace(/[\u200b\u00a0]/g," ").replace(/[：]/g,":").replace(/[，、;；]/g,",").replace(/[×✕✖]/g,"x").trim();
  s=s.replace(/^[\s\-*•·●▪\u2022\d]+[.)、]\s+(?=\D)/,"").replace(/^[-*•·●▪]\s*/,"");
  if(!s)continue;
  if(/^(saphirus.*|.*订货单|.*pedido.*|total.*|合计.*)$/i.test(s)&&!/\d\s*$/.test(s))continue;
  let m=s.match(/^(.*?)[\s:=,\-.xX]*[\s(（]*(\d{1,4})\s*(?:件|个|pcs|un\.?|u\.?|unidades|uds?\.?)?[)）]?\s*$/i);
  if(m&&m[1].trim()&&/\D/.test(m[1])){const n=m[1].trim().replace(/[\s:=,\-.xX]+$/,"");if(n){(cc||getCat(defCat||"GENERAL")).items.push({n:fixName(n),q:parseInt(m[2])});continue}}
  m=s.match(/^(\d{1,4})\s*(?:x|件|个|pcs|un\.?)?\s+(.+?)$/i);
  if(m&&/\D/.test(m[2])){(cc||getCat(defCat||"GENERAL")).items.push({n:fixName(m[2].trim()),q:parseInt(m[1])});continue}
  const h=s.replace(/[:：]\s*$/,"").trim();
  if(h.length<=40&&!/\d/.test(h)){
   // 只有当后面紧跟带数量的行时才算种类标题；否则当成一个没写数量的品项，避免静默丢失
   let nx="";for(let j=li+1;j<lines.length;j++){if(lines[j].trim()){nx=lines[j];break}}
   const nxItem=/\d{1,4}\s*(件|个|pcs|un\.?|u\.?|unidades|uds?\.?)?[)）]?\s*$/i.test(nx)||/^\s*\d{1,4}\s*(x|件|个)?\s+\D/i.test(nx);
   if(nxItem||/[:：]\s*$/.test(s)){cc=getCat(h.toUpperCase());continue}}
  (cc||getCat(defCat||"GENERAL")).items.push({n:fixName(s),q:1,guess:1});
 }
 return cats.filter(c=>c.items.length)}

 `<div class="mb2"><button class="g" onclick="importModal()">‹ 重新粘贴</button><button onclick="importApply()">导入 ${n} 项</button></div>`)}
function importApply(){

let CQ="",CSEL={},CML=true;
const OFF_TARGET={AROMA:["aroma","aerosol","aromatizante"],TEXTIL:["textil","textile","tela"],DIFUSORES:["difusor","difusores","dif"]};

function catKey(k,i){return k+"|"+i}
function catRender(first){
 const o=cur(),nq=norm(CQ);
 let h="",total=0,newN=0;
 Object.entries(OFFICIAL.cats).forEach(([key,list])=>{
  const ti=offTargetIdx(o,key),tgt=ti>=0?o.cats[ti]:null,have=new Set(tgt?tgt.items.map(i=>norm(i.n)):[]);
  const rows=list.map((it,i)=>({it,i})).filter(({it})=>(CML||!it[2])&&(!nq||norm(it[0]).includes(nq)));
  const sel=rows.filter(({i})=>CSEL[catKey(key,i)]).length,addable=rows.filter(({it})=>!have.has(norm(it[0])));
  total+=sel;newN+=rows.filter(({it,i})=>CSEL[catKey(key,i)]&&!have.has(norm(it[0]))).length;
  h+=`<div class="cg"><div class="cgh"><b>${key} <small style="font-weight:400;color:#999">${rows.length} 项 · 已选 ${sel}${tgt?"":" · 将新建种类"}</small></b><button onclick="catAll('${key}',true)">全选未有</button><button onclick="catAll('${key}',false)">清除</button></div>`+
  rows.map(({it,i})=>{const ex=have.has(norm(it[0]));return `<label class="co ${ex?"have":""}"><input type="checkbox" ${CSEL[catKey(key,i)]&&!ex?"checked":""} ${ex?"disabled":""} onchange="CSEL['${catKey(key,i)}']=this.checked;catRender()"><span>${esc(it[0])}${it[2]?' <small>60ml</small>':''}</span>${ex?'<span class="tg">已有</span>':`<small>$${it[1]}</small>`}</label>`}).join("")+`</div>`;
 });
 if(first){
  modal(`<div class="mh">官方目录导入</div><div class="mt">来自 saphirus.com.ar（${esc(OFFICIAL.date)}），共 ${Object.values(OFFICIAL.cats).reduce((a,b)=>a+b.length,0)} 个商品。勾选后导入，<b>数量默认 0</b>，订货时再改；数量为 0 的不会出现在海报和表格里。已在订单里的会标“已有”并跳过。</div>
  <input class="sq" id="cq" style="border:1px solid #e3d8c8;margin:0 0 6px" placeholder="🔍 搜索官方品名" oninput="CQ=this.value;catRender()">
  <label class="opt" style="margin:4px 0"><input type="checkbox" checked onchange="CML=this.checked;catRender()"> 包含 60ml 小规格（DIFUSORES）</label>
  <div class="cl" id="cl"></div>
  <div class="mb2"><button class="g" onclick="closeModal()">取消</button><button id="cgo" onclick="catApply()">导入</button></div>`);
 }
 const st=$("cl").scrollTop;$("cl").innerHTML=h;$("cl").scrollTop=st;$("cgo").textContent="导入 "+newN+" 项";$("cgo").disabled=!newN;
}
function catAll(key,on){const o=cur(),nq=norm(CQ),ti=offTargetIdx(o,key),have=new Set(ti>=0?o.cats[ti].items.map(i=>norm(i.n)):[]);
 OFFICIAL.cats[key].forEach((it,i)=>{if((CML||!it[2])&&(!nq||norm(it[0]).includes(nq))&&!have.has(norm(it[0])))CSEL[catKey(key,i)]=on});catRender()}
function catApply(){

/* ---------- PDF（纯前端，不依赖外部库：把 JPEG 直接封装成单页 PDF） ---------- */
function exportPdf(){
 if(!PCV)return;
 const jpg=atob(PCV.toDataURL("image/jpeg",0.92).split(",")[1]),w=PCV.width,h=PCV.height,pw=595,ph=Math.round(595*h/w);
 const bin=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a};
 const parts=[],offs=[];let len=0;
 const add=s=>{const b=typeof s=="string"?bin(s):s;parts.push(b);len+=b.length};
 const obj=(n,s)=>{offs[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
 add("%PDF-1.4\n");
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
 obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
 offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(bin(jpg));add("\nendstream\nendobj\n");
 const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
 const xr=len;add("xref\n0 6\n0000000000 65535 f \n"+[1,2,3,4,5].map(i=>String(offs[i]).padStart(10,"0")+" 00000 n \n").join(""));
 add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
 const o=cur();dlBlob(new Blob(parts,{type:"application/pdf"}),"pedido_"+((o.sup||"orden").replace(/[^\w\u4e00-\u9fa5-]+/g,"_"))+".pdf");toast("PDF 已生成");
}
