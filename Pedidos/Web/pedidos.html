<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>订货单管理器</title>
<link rel="stylesheet" href="css/app.css">
</head><body>

<div id="vHome"><div class="vwrap">
 <div id="tab_o" class="tp">
  <div class="top"><div class="r1"><h1>📦 订货单管理器</h1><b id="hCnt"></b></div>
   <input id="hq" class="sq" type="search" placeholder="搜索所有订单里的品项，如 Lola" oninput="HQ=this.value;renderHome()">
   <div id="hf" class="qc"></div></div>
  <div id="bkHint"></div>
  <div id="olist"></div>
 </div>
 <div id="tab_s" class="tp" style="display:none">
  <div class="top"><div class="r1"><h1>📖 品名库</h1><b id="sCnt"></b></div>
   <input id="sq2" class="sq" type="search" placeholder="搜索品名" oninput="vocPageList()"></div>
  <div class="pg">
   <div class="card"><div style="display:flex;gap:8px;align-items:center;padding:6px 0"><input class="sq" id="vnew" style="margin:0;flex:1;border:1px solid #e3d8c8" placeholder="手动添加品名" onkeydown="if(event.key=='Enter')vocPageAdd()"><button class="srow-b" onclick="vocPageAdd()">添加</button></div></div>
   <div id="vf" class="qc" style="margin:8px 0"></div><div class="pt">包含所有商品源（只读）和手动品名。订单里新用的品名会自动记进「手动」；删除只影响提示，不改已有订单。</div>
   <div id="vpl" class="card"></div>
  </div>
 </div>
 <div id="tab_t" class="tp" style="display:none">
  <div class="top"><div class="r1"><h1>⚙️ 设置</h1></div></div>
  <div class="pg" id="setp"></div>
 </div>
 <div class="foot">
  <div class="bk"><i class="lens" id="lens"></i><button data-t="o" onclick="setTab('o')"><span class="ti">📋</span>订单</button><button data-t="s" onclick="setTab('s')"><span class="ti">📖</span>品名库</button><button data-t="t" onclick="setTab('t')"><span class="ti">⚙️</span>设置</button></div>
 </div>
</div></div>

<div id="vEdit" style="display:none">
 <div class="top">
  <div class="r1"><button class="back" onclick="goHome()">‹ 列表</button><input id="eSup" class="tin" oninput="setf('sup',this.value)" placeholder="供应商 / 标题（点此输入）" autocapitalize="words"><input id="eDt" class="dti" oninput="setf('dt',this.value)" placeholder="dd/mm/aaaa" inputmode="numeric" aria-label="日期"><b id="eTotal"></b></div>
  <div class="qrow"><input id="q" type="search" placeholder="搜索品名来订货" oninput="onSearch(this.value)" onkeydown="qKey(event)" onfocus="SF=true;refreshCand()" onblur="setTimeout(()=>{SF=false;refreshCand()},250)"><label class="qcam" id="qcam" title="拍照或选图识别" onclick="if(NATIVE){event.preventDefault();nativePick(f=>aiPickPhoto(QC,{files:[f],value:''}))}">📷<input type="file" accept="image/*" style="display:none" onchange="aiPickPhoto(QC,this)"></label></div>
  <div id="qc" class="qc"></div>
  <div id="cbox" onmousedown="event.preventDefault()"></div>
 </div>
 <div class="meta2">
  <div class="seg" id="eSt"></div>
  <select id="eSort" onchange="setf('sort',this.value);renderEdit()"><option value="manual">排序：手动</option><option value="az">排序：A → Z</option><option value="qty">排序：数量多→少</option><option value="new">排序：最近添加</option></select>
  <div class="ptog"><button id="ePr" onclick="togglePrice()">&#36; 单价</button><input id="eCur" maxlength="4" oninput="setf('cur',this.value||'$');renderEdit()" title="货币符号"></div>
 </div>
 <div class="picbar" style="display:flex;gap:8px"><button class="g" onclick="picAuto()">🖼 一键匹配全部图片</button><button class="g" id="eUnit" style="flex:none;width:auto;padding:11px 16px" onclick="unitPick(-1)">📏 单位：件</button></div>
 <div id="list"></div>
 <div class="row3"><button id="ncb" class="pill" onclick="openNC()">＋ 新增种类</button><div id="ncw" class="ncw" hidden><input id="ncn" placeholder="种类名（可留空，只用图片）" autocapitalize="characters" oninput="liveCase(this,'upper')" onkeydown="if(event.key=='Enter')addCat();if(event.key=='Escape')closeNC()"><button class="ok" onclick="addCat()">添加</button><button class="cx" onclick="closeNC()">取消</button></div></div>
 <div class="row3"><button id="clrBtn" class="tiny" onclick="arm(this,clearQty,'再点一次确认清零')">全部数量清零</button></div>
 <div class="bar">
  <button class="g sm2" id="bUndo" onclick="undo()" title="撤销">↶</button>
  <button class="g sm2" id="bRedo" onclick="redo()" title="重做">↷</button>
  <button class="g fl" onclick="sendSheet()">📤 发送表格</button>
  <button class="g fl" onclick="poster()">🖼 生成海报</button>
  <button class="g sm2" onclick="moreMenu()" title="更多">⋯</button>
 </div>
</div>

<div id="md" onclick="if(event.target==this)mdBack()"><div id="mb"></div></div>
<div id="toast"></div>
<div id="pv"><div class="in">
 <div class="pbw">
  <div class="pvb"><button onclick="$('pv').style.display='none'">← 返回</button><a id="dl" download="pedido.png">保存图片</a><button onclick="exportPdf()">导出 PDF</button></div>
  <div class="po"><span>主题</span><span id="thm" style="display:flex;gap:8px"></span></div>
  <div class="po"><span>底色</span><div class="lg" style="margin-left:0"><button id="dkL" onclick="setDk(0)">浅色</button><button id="dkD" onclick="setDk(1)">深色</button></div><div class="lg"><button id="lgEs" onclick="setLang('es')">Español</button><button id="lgZh" onclick="setLang('zh')">中文</button></div></div>
 </div>
 <img id="pimg"><p>也可以长按图片 → 存储到照片 / 分享</p>
</div></div>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/sources.js"></script>
<script src="js/images.js"></script>
<script src="js/ai.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body></html>
