name: Pedidos
options:
  bundleIdPrefix: com.pedidos
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Pedidos:
    type: application
    platform: iOS
    sources:
      - path: Pedidos
        excludes: ["Info.plist"]
    resources:
      - path: Pedidos/Web
        type: folder
    info:
      path: Pedidos/Info.plist
      properties:
        CFBundleDisplayName: 订货单
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        NSCameraUsageDescription: 订货单需要使用相机拍摄商品图片
        NSPhotoLibraryUsageDescription: 订货单需要读取相册，用于为商品选择图片
        NSPhotoLibraryAddUsageDescription: 订货单需要把海报图片保存到相册
        NSMicrophoneUsageDescription: 拍摄照片时系统可能请求麦克风权限
        CFBundleName: Pedidos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedidos.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
